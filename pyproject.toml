[project]
name = "erp-example"
version = "0.1.0"
description = "Small ERP example (quotes, orders, invoices, stock) built on the RociaDB Python SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "rociadb-sdk==1.0.0",
    # `grpc.StatusCode` is named directly in main.py, so the package is declared
    # here rather than reached through the SDK's own dependency on it.
    "grpcio>=1.60",
]

[project.scripts]
erp-example = "erp_example.main:run"

[dependency-groups]
# `grpcio` ships no type information of its own, so the stubs are a dev
# dependency: they are what lets `mypy --strict` see `grpc.StatusCode`.
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-grpcio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_example"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
